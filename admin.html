<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pro Technology — Admin</title>
<style>
  :root {
    --bg: #0f1117; --surface: #1a1d27; --surface-2: #22263a;
    --border: rgba(255,255,255,.08); --fg: #f0f2ff; --fg-2: #8b90a8;
    --accent: #6395ff; --green: #25d366; --red: #ff5c5c; --yellow: #f5a623;
    --r: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--fg); font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; }

  /* LOGIN */
  .login-wrap { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
  .login-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 40px 36px; width: 100%; max-width: 360px; text-align: center; }
  .login-card h1 { font-size: 1.4rem; margin-bottom: 6px; }
  .login-card p { color: var(--fg-2); font-size: .88rem; margin-bottom: 28px; }
  .login-card input { width: 100%; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; color: var(--fg); font-size: .95rem; margin-bottom: 14px; outline: none; }
  .login-card input:focus { border-color: var(--accent); }
  .login-card button { width: 100%; background: var(--accent); border: none; border-radius: 8px; padding: 13px; color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer; transition: opacity .15s; }
  .login-card button:hover { opacity: .85; }
  .login-err { color: var(--red); font-size: .84rem; margin-top: 10px; min-height: 20px; }

  /* LAYOUT */
  .shell { display: none; flex-direction: column; min-height: 100vh; }
  .shell.show { display: flex; }
  header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 28px; height: 60px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
  header h1 { font-size: 1.05rem; font-weight: 700; }
  header span { color: var(--fg-2); font-size: .82rem; }
  .logout-btn { background: none; border: 1px solid var(--border); border-radius: 6px; color: var(--fg-2); padding: 6px 14px; font-size: .82rem; cursor: pointer; }
  .logout-btn:hover { color: var(--fg); border-color: var(--fg-2); }

  .main { padding: 28px; flex: 1; max-width: 1200px; margin: 0 auto; width: 100%; }

  /* TABS */
  .tabs { display: flex; gap: 6px; margin-bottom: 24px; border-bottom: 1px solid var(--border); padding-bottom: 0; }
  .tab { padding: 10px 20px; border: none; background: none; color: var(--fg-2); font-size: .9rem; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color .15s; }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }

  /* STAT CARDS */
  .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; margin-bottom: 28px; }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 20px; }
  .stat-card .label { font-size: .78rem; color: var(--fg-2); margin-bottom: 8px; text-transform: uppercase; letter-spacing: .06em; }
  .stat-card .val { font-size: 1.8rem; font-weight: 700; }
  .stat-card .val.green { color: var(--green); }
  .stat-card .val.yellow { color: var(--yellow); }
  .stat-card .val.accent { color: var(--accent); }

  /* TABLE */
  .table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; }
  .table-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .table-header h3 { font-size: .95rem; font-weight: 600; }
  .refresh-btn { background: none; border: 1px solid var(--border); border-radius: 6px; color: var(--fg-2); padding: 6px 12px; font-size: .8rem; cursor: pointer; }
  .refresh-btn:hover { color: var(--fg); }
  table { width: 100%; border-collapse: collapse; }
  th { background: var(--surface-2); padding: 11px 16px; text-align: left; font-size: .78rem; color: var(--fg-2); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
  td { padding: 13px 16px; border-top: 1px solid var(--border); font-size: .88rem; vertical-align: top; }
  tr:hover td { background: rgba(255,255,255,.025); }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 99px; font-size: .75rem; font-weight: 600; }
  .badge.pending  { background: rgba(245,166,35,.15); color: var(--yellow); }
  .badge.confirmed{ background: rgba(99,149,255,.15); color: var(--accent); }
  .badge.delivered{ background: rgba(37,211,102,.15); color: var(--green); }
  .badge.cancelled{ background: rgba(255,92,92,.15);  color: var(--red); }
  .badge.active   { background: rgba(37,211,102,.15); color: var(--green); }
  .badge.inactive { background: rgba(255,92,92,.15);  color: var(--red); }

  select.status-sel { background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; color: var(--fg); padding: 4px 8px; font-size: .82rem; cursor: pointer; }

  .items-list { font-size: .82rem; color: var(--fg-2); line-height: 1.6; }
  .empty { text-align: center; padding: 48px; color: var(--fg-2); font-size: .9rem; }
  .loading { text-align: center; padding: 48px; color: var(--fg-2); }

  /* PRODUCTS */
  .add-btn { background: var(--accent); border: none; border-radius: 8px; color: #fff; padding: 8px 18px; font-size: .88rem; font-weight: 600; cursor: pointer; }
  .add-btn:hover { opacity: .85; }
  .prod-img { width: 48px; height: 48px; object-fit: cover; border-radius: 6px; background: var(--surface-2); }
  .prod-img-placeholder { width: 48px; height: 48px; border-radius: 6px; background: var(--surface-2); display: flex; align-items: center; justify-content: center; color: var(--fg-2); font-size: .7rem; }

  /* MODAL */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.7); display: none; align-items: center; justify-content: center; z-index: 9000; padding: 20px; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 28px; width: 100%; max-width: 480px; }
  .modal h3 { font-size: 1.1rem; margin-bottom: 20px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: .82rem; color: var(--fg-2); margin-bottom: 5px; }
  .field input, .field textarea, .field select { width: 100%; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; color: var(--fg); font-size: .9rem; outline: none; resize: vertical; }
  .field input:focus, .field textarea:focus, .field select:focus { border-color: var(--accent); }
  .modal-footer { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
  .btn-cancel { background: none; border: 1px solid var(--border); border-radius: 8px; color: var(--fg-2); padding: 10px 20px; font-size: .9rem; cursor: pointer; }
  .btn-save { background: var(--accent); border: none; border-radius: 8px; color: #fff; padding: 10px 22px; font-size: .9rem; font-weight: 600; cursor: pointer; }
  .btn-save:hover { opacity: .85; }
  .del-btn { background: none; border: 1px solid rgba(255,92,92,.3); border-radius: 6px; color: var(--red); padding: 5px 11px; font-size: .8rem; cursor: pointer; }
  .del-btn:hover { background: rgba(255,92,92,.1); }
  .edit-btn { background: none; border: 1px solid var(--border); border-radius: 6px; color: var(--fg-2); padding: 5px 11px; font-size: .8rem; cursor: pointer; margin-right: 4px; }
  .edit-btn:hover { color: var(--fg); }

  @media (max-width: 700px) {
    .main { padding: 16px; }
    th, td { padding: 10px 10px; }
    th:nth-child(4), td:nth-child(4) { display: none; }
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-wrap" id="loginWrap">
  <div class="login-card">
    <h1>Pro Technology</h1>
    <p>Admin Portal</p>
    <input type="password" id="pwInput" placeholder="Enter password" autocomplete="current-password">
    <button onclick="doLogin()">Login</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<!-- SHELL -->
<div class="shell" id="shell">
  <header>
    <h1>Pro Technology &mdash; Admin</h1>
    <div style="display:flex;align-items:center;gap:16px">
      <span id="headerTime"></span>
      <button class="logout-btn" onclick="doLogout()">Logout</button>
    </div>
  </header>
  <div class="main">
    <div class="tabs">
      <button class="tab active" onclick="switchTab('orders',this)">Orders</button>
      <button class="tab" onclick="switchTab('products',this)">Products</button>
    </div>

    <!-- ORDERS TAB -->
    <div id="tab-orders">
      <div class="stats" id="statsRow"></div>
      <div class="table-wrap">
        <div class="table-header">
          <h3>All Orders</h3>
          <button class="refresh-btn" onclick="loadOrders()">↻ Refresh</button>
        </div>
        <div id="ordersBody"><div class="loading">Loading…</div></div>
      </div>
    </div>

    <!-- PRODUCTS TAB -->
    <div id="tab-products" style="display:none">
      <div class="table-wrap">
        <div class="table-header">
          <h3>Products</h3>
          <div style="display:flex;gap:8px">
            <button class="refresh-btn" onclick="loadProducts()">↻ Refresh</button>
            <button class="add-btn" onclick="openProductModal()">+ Add Product</button>
          </div>
        </div>
        <div id="productsBody"><div class="loading">Loading…</div></div>
      </div>
    </div>
  </div>
</div>

<!-- PRODUCT MODAL -->
<div class="modal-overlay" id="prodModal">
  <div class="modal">
    <h3 id="modalTitle">Add Product</h3>
    <div class="field"><label>Name *</label><input id="p_name" placeholder="Product name"></div>
    <div class="field"><label>Price ($) *</label><input id="p_price" type="number" step="0.01" placeholder="0.00"></div>
    <div class="field"><label>Category</label><input id="p_category" placeholder="e.g. Headphones"></div>
    <div class="field"><label>Image URL</label><input id="p_image" placeholder="https://…"></div>
    <div class="field"><label>Description</label><textarea id="p_desc" rows="3" placeholder="Short description…"></textarea></div>
    <div class="field">
      <label>Status</label>
      <select id="p_active">
        <option value="true">Active</option>
        <option value="false">Inactive</option>
      </select>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeProdModal()">Cancel</button>
      <button class="btn-save" id="saveBtn" onclick="saveProduct()">Save</button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL  = "https://cgmqovyttrjecrbynooo.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNnbXFvdnl0dHJqZWNyYnlub29vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0Mzg4MDAsImV4cCI6MjEwNjAxNDgwMH0.T0fRGI4e1i0xcfVMdLZo_UTnCIGRaBjYgC_JjzcfjT0";
const PASS_HASH     = "6b82942a5c3da8c09d98c3e2d9c2a9ef3db6b9e3"; // sha1 of protech2024

async function sha1(str) {
  const buf = await crypto.subtle.digest("SHA-1", new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,"0")).join("");
}

async function doLogin() {
  const pw = document.getElementById("pwInput").value;
  const h  = await sha1(pw);
  if (h === PASS_HASH) {
    sessionStorage.setItem("pt_admin", "1");
    document.getElementById("loginWrap").style.display = "none";
    document.getElementById("shell").classList.add("show");
    init();
  } else {
    document.getElementById("loginErr").textContent = "Incorrect password.";
  }
}
document.getElementById("pwInput").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });

function doLogout() {
  sessionStorage.removeItem("pt_admin");
  location.reload();
}

if (sessionStorage.getItem("pt_admin")) {
  document.getElementById("loginWrap").style.display = "none";
  document.getElementById("shell").classList.add("show");
  init();
}

function init() {
  loadOrders();
  setInterval(() => {
    const t = document.getElementById("headerTime");
    if (t) t.textContent = new Date().toLocaleTimeString('en-GB');
  }, 1000);
}

async function sbFetch(path, opts = {}) {
  const res = await fetch(SUPABASE_URL + path, {
    cache: "no-store", ...opts,
    headers: { "apikey": SUPABASE_ANON, "Authorization": "Bearer " + SUPABASE_ANON, "Content-Type": "application/json", ...(opts.headers||{}) }
  });
  if (!res.ok) throw new Error(await res.text());
  const t = await res.text();
  return t ? JSON.parse(t) : null;
}

function switchTab(name, el) {
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  el.classList.add("active");
  document.getElementById("tab-orders").style.display   = name === "orders"   ? "" : "none";
  document.getElementById("tab-products").style.display = name === "products" ? "" : "none";
  if (name === "products") loadProducts();
}

// ── ORDERS ──────────────────────────────────────────────────────────
async function loadOrders() {
  document.getElementById("ordersBody").innerHTML = '<div class="loading">Loading…</div>';
  try {
    const orders = await sbFetch("/rest/v1/pt_orders?select=*&order=created_at.desc", { headers: { Prefer: "return=representation" } });
    renderStats(orders || []);
    renderOrders(orders || []);
  } catch(e) {
    document.getElementById("ordersBody").innerHTML = '<div class="empty">Failed to load orders.</div>';
  }
}

function renderStats(orders) {
  const total     = orders.length;
  const pending   = orders.filter(o => o.status === "pending").length;
  const revenue   = orders.filter(o => o.status !== "cancelled").reduce((s, o) => s + (o.total || 0), 0);
  const delivered = orders.filter(o => o.status === "delivered").length;
  document.getElementById("statsRow").innerHTML = `
    <div class="stat-card"><div class="label">Total Orders</div><div class="val accent">${total}</div></div>
    <div class="stat-card"><div class="label">Pending</div><div class="val yellow">${pending}</div></div>
    <div class="stat-card"><div class="label">Delivered</div><div class="val green">${delivered}</div></div>
    <div class="stat-card"><div class="label">Revenue</div><div class="val green">$${revenue.toFixed(2)}</div></div>
  `;
}

function renderOrders(orders) {
  if (!orders.length) {
    document.getElementById("ordersBody").innerHTML = '<div class="empty">No orders yet.</div>';
    return;
  }
  const rows = orders.map(o => {
    const items = Array.isArray(o.items) ? o.items.map(i => `${i.name} ×${i.qty}`).join("<br>") : "—";
    const date  = o.created_at ? new Date(o.created_at).toLocaleString('en-GB', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' }) : "—";
    return `<tr>
      <td style="color:var(--fg-2);font-size:.8rem">${date}</td>
      <td><strong>${o.customer_name || "—"}</strong><br><span style="color:var(--fg-2);font-size:.82rem">${o.customer_phone || ""}</span></td>
      <td><div class="items-list">${items}</div></td>
      <td><strong>$${(o.total||0).toFixed(2)}</strong></td>
      <td>${o.notes ? `<span style="color:var(--fg-2);font-size:.82rem">${o.notes}</span>` : "—"}</td>
      <td>
        <select class="status-sel" data-id="${o.id}" onchange="updateOrderStatus(this)">
          ${["pending","confirmed","delivered","cancelled"].map(s => `<option value="${s}" ${o.status===s?"selected":""}>${s.charAt(0).toUpperCase()+s.slice(1)}</option>`).join("")}
        </select>
      </td>
    </tr>`;
  }).join("");
  document.getElementById("ordersBody").innerHTML = `
    <table>
      <thead><tr><th>Date</th><th>Customer</th><th>Items</th><th>Total</th><th>Note</th><th>Status</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

async function updateOrderStatus(sel) {
  const id = sel.dataset.id;
  try {
    await sbFetch(`/rest/v1/pt_orders?id=eq.${id}`, { method: "PATCH", body: JSON.stringify({ status: sel.value }) });
    loadOrders();
  } catch(e) { alert("Failed to update status."); }
}

// ── PRODUCTS ─────────────────────────────────────────────────────────
async function loadProducts() {
  document.getElementById("productsBody").innerHTML = '<div class="loading">Loading…</div>';
  try {
    const prods = await sbFetch("/rest/v1/pt_products?select=*&order=name.asc");
    renderProducts(prods || []);
  } catch(e) {
    document.getElementById("productsBody").innerHTML = '<div class="empty">Failed to load products.</div>';
  }
}

function renderProducts(prods) {
  if (!prods.length) {
    document.getElementById("productsBody").innerHTML = '<div class="empty">No products yet.</div>';
    return;
  }
  const rows = prods.map(p => `<tr>
    <td>${p.image_url ? `<img class="prod-img" src="${p.image_url}" loading="lazy">` : `<div class="prod-img-placeholder">IMG</div>`}</td>
    <td><strong>${p.name}</strong></td>
    <td>${p.category || "—"}</td>
    <td><strong>$${(p.price||0).toFixed(2)}</strong></td>
    <td><span class="badge ${p.active !== false ? 'active' : 'inactive'}">${p.active !== false ? "Active" : "Inactive"}</span></td>
    <td>
      <button class="edit-btn" onclick='openProductModal(${JSON.stringify(p)})'>Edit</button>
      <button class="del-btn" onclick="deleteProduct(${p.id}, '${(p.name||"").replace(/'/g,"\\'")}')">Delete</button>
    </td>
  </tr>`).join("");
  document.getElementById("productsBody").innerHTML = `
    <table>
      <thead><tr><th></th><th>Name</th><th>Category</th><th>Price</th><th>Status</th><th>Actions</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

let editingId = null;
function openProductModal(p) {
  editingId = p ? p.id : null;
  document.getElementById("modalTitle").textContent = p ? "Edit Product" : "Add Product";
  document.getElementById("p_name").value     = p?.name || "";
  document.getElementById("p_price").value    = p?.price || "";
  document.getElementById("p_category").value = p?.category || "";
  document.getElementById("p_image").value    = p?.image_url || "";
  document.getElementById("p_desc").value     = p?.description || "";
  document.getElementById("p_active").value   = String(p?.active !== false);
  document.getElementById("prodModal").classList.add("open");
}
function closeProdModal() {
  document.getElementById("prodModal").classList.remove("open");
  editingId = null;
}

async function saveProduct() {
  const name  = document.getElementById("p_name").value.trim();
  const price = parseFloat(document.getElementById("p_price").value);
  if (!name || isNaN(price)) { alert("Name and price are required."); return; }
  const btn = document.getElementById("saveBtn");
  btn.disabled = true; btn.textContent = "Saving…";
  const body = {
    name,
    price,
    category:    document.getElementById("p_category").value.trim() || null,
    image_url:   document.getElementById("p_image").value.trim() || null,
    description: document.getElementById("p_desc").value.trim() || null,
    active:      document.getElementById("p_active").value === "true"
  };
  try {
    if (editingId) {
      await sbFetch(`/rest/v1/pt_products?id=eq.${editingId}`, { method: "PATCH", body: JSON.stringify(body) });
    } else {
      await sbFetch("/rest/v1/pt_products", { method: "POST", body: JSON.stringify(body) });
    }
    closeProdModal();
    loadProducts();
  } catch(e) { alert("Failed to save."); }
  finally { btn.disabled = false; btn.textContent = "Save"; }
}

async function deleteProduct(id, name) {
  if (!confirm(`Delete "${name}"?`)) return;
  try {
    await sbFetch(`/rest/v1/pt_products?id=eq.${id}`, { method: "DELETE" });
    loadProducts();
  } catch(e) { alert("Failed to delete."); }
}
</script>
</body>
</html>
